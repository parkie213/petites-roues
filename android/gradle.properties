org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true

# Device tests (connectedDebugAndroidTest) leave the app installed with its data, instead of
# uninstalling it afterwards, which would wipe the phone's pairing, folders and progress.
android.injected.androidTest.leaveApksInstalledAfterRun=true
