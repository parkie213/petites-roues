server.address=127.0.0.1
server.port=8877
server.error.include-message=always
spring.datasource.url=jdbc:sqlite:content/library.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000

# Flyway owns both fresh creation and upgrades. Version 0 adopts pre-Flyway catalogues
# without skipping V1 (which also creates any tables missing from old catalogues).
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
