server.address=127.0.0.1
server.port=8877
server.error.include-message=always
spring.datasource.url=jdbc:sqlite:content/library.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.datasource.hikari.data-source-properties.busy_timeout=5000

# Flyway creates the catalogue and applies later migrations. A catalogue from before V1 (or not
# created by Flyway) refuses to start: delete it and add the folders again.
spring.sql.init.mode=never

# The agent protocol is an opt-in trial; normal REST and phone operation stays as before.
spring.ai.mcp.server.enabled=false
spring.ai.mcp.server.annotation-scanner.enabled=false
