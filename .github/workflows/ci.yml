name: CI

# Pull requests, and main after a merge: a push to a branch with a PR open would otherwise run
# the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The shared Java modules are built and tested once; the server and the
# Android app are then built against those same jars. The web app needs neither, so runs alongside.
jobs:
  library:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Test and install the shared library
        run: ./java/mvnw -B -f java/pom.xml -pl content-model,learner-state-model,study-prompts,document-json,content-library,sync -am install -Dmaven.test.failure.ignore=true
      - uses: actions/upload-artifact@v7
        with:
          name: library
          path: ~/.m2/repository/app/petitesroues
          retention-days: 1

  server:
    needs: library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: library
          # Straight over the restored Maven cache, whose own copy of the library may be stale.
          path: ~/.m2/repository/app/petitesroues
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the French voice for real JNI speech tests
        run: bash setup/speech.sh
      - name: Verify the server against the built library
        run: ./java/mvnw -B -f java/pom.xml -pl desktop-test-fixtures,desktop-application,desktop-server verify -Dpetitesroues.test.voices="$HOME/.local/share/piper/voices"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: web
      # The web journeys replay responses recorded from this server. Recording them again from the
      # server just verified, and finding nothing changed, shows the API hasn't drifted from them.
      # A journey that fails on its recordings too is the web's to fix, and the web job reports it;
      # one that passes on them but fails here was broken by the server. Recording starts from no
      # recordings, so one left behind by a renamed or removed journey shows up as deleted.
      - name: Check the API still answers the web's recorded journeys
        run: |
          rm -rf e2e/fixtures
          if ! npm run e2e:record; then
            git checkout -- e2e/fixtures
            if npm run e2e; then
              echo "::error::A journey passes on its recordings but fails against this server"
              exit 1
            fi
            echo "::warning::Journeys fail on their recordings too; the web job reports them"
          fi
          # A recording no journey made any more stays deleted; say so before the diff shows it.
          for file in $(git ls-files --deleted e2e/fixtures); do
            echo "::error file=web/$file::No journey records web/$file any more: remove it with git rm"
          done
          git diff --exit-code e2e/fixtures
          test -z "$(git status --porcelain e2e/fixtures)"
        working-directory: web
      - name: Keep the recording report when the API check failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-recording-report
          path: web/playwright-report
          if-no-files-found: ignore

  # The web app on its own, with no Java: its journeys replayed from their recordings, and
  # screenshots compared in Playwright's Docker image.
  web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      # In Playwright's Docker image, as locally, so screenshots match their references.
      - name: End-to-end journeys and screenshots against the recordings
        run: npm run e2e:screenshots
      - name: Static GitHub Pages comic demo
        run: npm run e2e:screenshots -- --config playwright.demo.config.mjs
      - name: Keep the end-to-end report when a journey failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  android:
    needs: library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          # setup-java's own Gradle cache: gradle/actions' caching needs Gradle's proprietary terms
          # since v6. The default key looks for the version catalogue at the root, so name ours.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/download-artifact@v8
        with:
          name: library
          path: ~/.m2/repository/app/petitesroues
      - name: Check formatting, lint, test (screenshots included) and build the Android app against the built library
        run: ./gradlew --no-daemon -PprebuiltLibrary spotlessCheck :app:lintDebug :app:verifyRoborazziDebug :app:assembleDebug
        working-directory: android
      - name: Keep the screenshot comparisons when a screen changed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore

  # The instrumented tests, on a real Android runtime. ART does not report records as records, so
  # the shared reader could not build its private wire record and every phone document failed to
  # decode: JVM and Robolectric tests run on the JVM, which cannot see this class of bug.
  android-device:
    needs: library
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/download-artifact@v8
        with:
          name: library
          path: ~/.m2/repository/app/petitesroues
      # The emulator needs hardware acceleration, which the runner offers through KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator snapshot
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-x86_64-default
      # With no snapshot cached, boot once and save it, so later runs start from it.
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the emulator snapshot"
      - name: Run the instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          # The cached snapshot can hold an earlier run's build, signed with another runner's debug
          # key. Gradle then fails the install yet still exits 0, so remove it first.
          script: |
            adb uninstall app.petitesroues.android || true
            adb uninstall app.petitesroues.android.test || true
            ./gradlew --no-daemon -PprebuiltLibrary :app:connectedDebugAndroidTest
      - name: Keep the instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: warn
      # A green Gradle run is not proof that tests ran, so count them from the result XML.
      - name: Check the instrumented tests actually ran
        if: always()
        env:
          # The number of @Test methods under android/app/src/androidTest.
          # Raise it when device tests are added.
          MIN_DEVICE_TESTS: 7
          REQUIRED_CLASSES: DocumentReaderDeviceTest ProgressStoreTest
        run: |
          python3 - <<'PY'
          import collections, glob, os, sys
          import xml.etree.ElementTree as ET

          results = "android/app/build/outputs/androidTest-results/connected"
          files = glob.glob(results + "/**/TEST-*.xml", recursive=True)
          # Per class: [tests, failures, skipped]; failures include errors.
          classes = collections.defaultdict(lambda: [0, 0, 0])
          for path in files:
              for case in ET.parse(path).iter("testcase"):
                  counts = classes[case.get("classname").rsplit(".", 1)[-1]]
                  counts[0] += 1
                  counts[1] += case.find("failure") is not None or case.find("error") is not None
                  counts[2] += case.find("skipped") is not None

          print(f"{len(files)} result file(s) under {results}")
          for name, (tests, failures, skipped) in sorted(classes.items()):
              print(f"{name}: {tests} tests, {failures} failures, {skipped} skipped")
          total = sum(counts[0] for counts in classes.values())
          print(f"total: {total} tests")

          problems = []
          minimum = int(os.environ["MIN_DEVICE_TESTS"])
          if total < minimum:
              problems.append(f"only {total} tests ran, expected at least {minimum}")
          for name in os.environ["REQUIRED_CLASSES"].split():
              if name not in classes:
                  problems.append(f"{name} did not run")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
