name: CI

# Pull requests, and main after a merge: a push to a branch with a PR open would otherwise run
# the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The shared Java library (the document model) is built and tested once; the server and the
# Android app are then built against that same jar.
jobs:
  library:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Test and install the shared library
        run: ./java/mvnw -B -f java/pom.xml -pl documents,library,sync -am install
      - uses: actions/upload-artifact@v7
        with:
          name: library
          path: ~/.m2/repository/com/petitesroues
          retention-days: 1

  server:
    needs: library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: library
          # Straight over the restored Maven cache, whose own copy of the library may be stale.
          path: ~/.m2/repository/com/petitesroues
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify the server against the built library
        run: ./java/mvnw -B -f java/pom.xml -pl application,server verify
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: web
      - name: Lint frontend
        run: npm run lint
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Test frontend
        run: npm test
        working-directory: web

  android:
    needs: library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          # setup-java's own Gradle cache: gradle/actions' caching needs Gradle's proprietary terms
          # since v6. The default key looks for the version catalogue at the root, so name ours.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/download-artifact@v8
        with:
          name: library
          path: ~/.m2/repository/com/petitesroues
      - name: Check formatting, lint, test (screenshots included) and build the Android app against the built library
        run: ./gradlew --no-daemon -PprebuiltLibrary spotlessCheck :app:lintDebug :app:verifyRoborazziDebug :app:assembleDebug
        working-directory: android
      - name: Keep the screenshot comparisons when a screen changed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
