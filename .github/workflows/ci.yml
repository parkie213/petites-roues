name: CI

# Pull requests, and main after a merge: a push to a branch with a PR open would otherwise run
# the same commit twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The shared Java library (the document model) is built and tested once; the server and the
# Android app are then built against that same jar. The web app needs neither, so runs alongside.
jobs:
  library:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Test and install the shared library
        run: ./java/mvnw -B -f java/pom.xml -pl document-model,document-json,content-library,sync -am install
      - uses: actions/upload-artifact@v7
        with:
          name: library
          path: ~/.m2/repository/app/petitesroues
          retention-days: 1

  server:
    needs: library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: library
          # Straight over the restored Maven cache, whose own copy of the library may be stale.
          path: ~/.m2/repository/app/petitesroues
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify the server against the built library
        run: ./java/mvnw -B -f java/pom.xml -pl desktop-application,desktop-server verify
      - name: Install frontend dependencies
        run: npm ci
        working-directory: web
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium
        working-directory: web
      # The web journeys replay responses recorded from this server. Recording them again from the
      # server just verified, and finding nothing changed, shows the API hasn't drifted from them.
      # A journey that fails on its recordings too is the web's to fix, and the web job reports it;
      # one that passes on them but fails here was broken by the server. Recording starts from no
      # recordings, so one left behind by a renamed or removed journey shows up as deleted.
      - name: Check the API still answers the web's recorded journeys
        run: |
          rm -rf e2e/fixtures
          if ! npm run e2e:record; then
            git checkout -- e2e/fixtures
            if npm run e2e; then
              echo "::error::A journey passes on its recordings but fails against this server"
              exit 1
            fi
            echo "::warning::Journeys fail on their recordings too; the web job reports them"
          fi
          # A recording no journey made any more stays deleted; say so before the diff shows it.
          for file in $(git ls-files --deleted e2e/fixtures); do
            echo "::error file=web/$file::No journey records web/$file any more: remove it with git rm"
          done
          git diff --exit-code e2e/fixtures
          test -z "$(git status --porcelain e2e/fixtures)"
        working-directory: web
      - name: Keep the recording report when the API check failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-recording-report
          path: web/playwright-report
          if-no-files-found: ignore

  # The web app on its own, with no Java: its journeys replayed from their recordings, and
  # screenshots compared in Playwright's Docker image.
  web:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      # In Playwright's Docker image, as locally, so screenshots match their references.
      - name: End-to-end journeys and screenshots against the recordings
        run: npm run e2e:screenshots
      - name: Keep the end-to-end report when a journey failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  android:
    needs: library
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          # setup-java's own Gradle cache: gradle/actions' caching needs Gradle's proprietary terms
          # since v6. The default key looks for the version catalogue at the root, so name ours.
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/download-artifact@v8
        with:
          name: library
          path: ~/.m2/repository/app/petitesroues
      - name: Check formatting, lint, test (screenshots included) and build the Android app against the built library
        run: ./gradlew --no-daemon -PprebuiltLibrary spotlessCheck :app:lintDebug :app:verifyRoborazziDebug :app:assembleDebug
        working-directory: android
      - name: Keep the screenshot comparisons when a screen changed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
