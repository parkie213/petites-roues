name: Deploy website and comic demo

on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'example/documents-fr/comics/lulu/**', 'example/media-fr/comics/lulu/**', 'example/demo/**', 'example/documents-fr/notes/**', 'example/documents-fr/quizzes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build website and static comic demo
        run: npm run build:site
        working-directory: web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
