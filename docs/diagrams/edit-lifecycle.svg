<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:895px;height:653px;background:#FFFFFF;" width="895px" height="653px" viewBox="0 0 895 653" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Pending" id="ent0001" data-source-line="6"><rect x="327.26" y="118" width="298.154" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="327.26" y1="144.297" x2="625.414" y2="144.297" style="stroke:#181818;stroke-width:0.5;"/><text x="448.105" y="135.995" fill="#000" font-size="14" textLength="56.465">Pending</text><text x="332.26" y="162.292" fill="#000" font-size="14" textLength="278.154">in the served copy, saved with the edit;</text><text x="332.26" y="178.589" fill="#000" font-size="14" textLength="269.104">replayed again on completion, discard</text><text x="332.26" y="194.886" fill="#000" font-size="14" textLength="64.996">or import</text></g><g class="entity" data-qualified-name="Conflict" id="ent0002" data-source-line="8"><rect x="7" y="318.34" width="258.684" height="68.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="344.637" x2="265.684" y2="344.637" style="stroke:#181818;stroke-width:0.5;"/><text x="109.788" y="336.335" fill="#000" font-size="14" textLength="53.108">Conflict</text><text x="12" y="362.632" fill="#000" font-size="14" textLength="224.041">stored by the rebuild, left out of</text><text x="12" y="378.929" fill="#000" font-size="14" textLength="238.684">the served copy; decided by hand</text></g><g class="entity" data-qualified-name="Claimed" id="ent0003" data-source-line="10"><rect x="333.47" y="310.19" width="285.74" height="85.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="333.47" y1